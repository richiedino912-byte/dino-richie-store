<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DÏÑØ RÏĆHÍĘ Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20">

    <!-- Top Bar -->
    <div class="bg-black text-white text-xs py-2 px-4 flex justify-between">
        <span>⭐ Hotline: <a href="tel:08023589140" class="text-orange-400 font-bold">08023589140</a></span>
        <span>📦 Nationwide Delivery Nigeria</span>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="filterCat('all')">
                <div class="bg-orange-500 text-white font-black text-xl p-2.5 rounded-xl">DR</div>
                <div>
                    <h1 class="font-black text-lg tracking-tight uppercase">DÏÑØ RÏĆHÍĘ</h1>
                    <span class="text-[10px] uppercase font-bold text-orange-600 tracking-widest">Official Store</span>
                </div>
            </div>
            <button onclick="openOrderModal()" class="bg-orange-50 text-orange-600 border border-orange-200 px-4 py-2 rounded-xl font-bold text-sm">
                🛒 Checkout Order
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- Categories -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
            <button onclick="filterCat('all')" class="p-3 bg-orange-50 text-orange-600 border border-orange-200 rounded-xl font-bold text-xs">🔥 All Products</button>
            <button onclick="filterCat('barbing')" class="p-3 bg-gray-50 border rounded-xl font-semibold text-xs">✂️ Barbing Tools</button>
            <button onclick="filterCat('hair')" class="p-3 bg-gray-50 border rounded-xl font-semibold text-xs">💇‍♀️ Hair & Wigs</button>
            <button onclick="filterCat('fashion')" class="p-3 bg-gray-50 border rounded-xl font-semibold text-xs">👕 Fashion & Wear</button>
        </div>

        <!-- Products Grid -->
        <div>
            <h2 id="secTitle" class="text-base font-bold mb-4">Available Products</h2>
            <div id="grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 rounded-full h-8 w-8 font-bold">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const items = [
            { id: 1, name: "Professional Heavy Duty Cordless Hair Clipper", cat: "barbing", price: 32500, old: 45000, ship: 3500, rating: "★★★★☆ (143)", img: "https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=500&auto=format&fit=crop&q=60", desc: "High-precision professional cordless hair clipper built for clean cuts and fades." },
            { id: 2, name: "Professional Barber Cape & Neck Duster Set", cat: "barbing", price: 8500, old: 12000, ship: 2000, rating: "★★★★★ (52)", img: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=500&auto=format&fit=crop&q=60", desc: "Waterproof professional barber cape with smooth neck closure." },
            { id: 3, name: "Luxury 24 Inches Super Bone Straight Human Hair Wig", cat: "hair", price: 85000, old: 120000, ship: 4500, rating: "★★★★★ (89)", img: "https://images.unsplash.com/photo-1560869713-7d0a29430803?w=500&auto=format&fit=crop&q=60", desc: "100% premium human hair bone straight wig. Tangle-free." },
            { id: 4, name: "Men's Luxury Designer Casual Sneaker Shoes", cat: "fashion", price: 28000, old: 40000, ship: 3000, rating: "★★★★★ (67)", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60", desc: "Premium designer sneakers built for ultimate comfort and style.", hasSize: true, sizes: ["40", "41", "42", "43", "44", "45"] }
        ];

        let selectedItem = null;

        function render(list) {
            const g = document.getElementById('grid');
            g.innerHTML = '';
            list.forEach(p => {
                g.innerHTML += `
                    <div onclick="openItem(${p.id})" class="bg-white rounded-xl border p-3 flex flex-col justify-between cursor-pointer hover:shadow-md transition">
                        <div>
                            <img src="${p.img}" class="h-40 w-full object-cover rounded-lg mb-2">
                            <h3 class="text-xs font-medium line-clamp-2 h-8">${p.name}</h3>
                            <div class="mt-2 font-black text-sm">₦${p.price.toLocaleString()} <span class="text-gray-400 line-through text-[10px]">₦${p.old.toLocaleString()}</span></div>
                            <div class="text-orange-400 text-[10px]">${p.rating}</div>
                        </div>
                        <button class="mt-3 bg-orange-500 text-white py-2 rounded-lg font-bold text-xs">View & Order</button>
                    </div>`;
            });
        }

        function openItem(id) {
            const p = items.find(x => x.id === id);
            selectedItem = p;
            let sizeHtml = p.hasSize ? `<label class="block text-xs font-bold mb-1">Select Size:</label><select id="sz" class="w-full border p-2 rounded mb-3">${p.sizes.map(s=>`<option>${s}</option>`).join('')}</select>` : '';
            
            document.getElementById('modalBody').innerHTML = `
                <h3 class="font-bold text-base mb-2">${p.name}</h3>
                <img src="${p.img}" class="h-48 w-full object-cover rounded-lg mb-3">
                <div class="font-black text-lg mb-2">₦${p.price.toLocaleString()}</div>
                ${sizeHtml}
                <p class="text-xs text-gray-600 mb-4">${p.desc}</p>
                <div class="space-y-2">
                    <input type="text" id="cName" placeholder="Full Name" class="w-full border p-2 rounded text-sm">
                    <input type="tel" id="cPhone" placeholder="Phone Number" class="w-full border p-2 rounded text-sm">
                    <textarea id="cAddr" placeholder="Delivery Address" class="w-full border p-2 rounded text-sm" rows="2"></textarea>
                    <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-sm">🚀 Send Order to WhatsApp</button>
                </div>`;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function openOrderModal() {
            if(!selectedItem) { alert('Tap a product first!'); return; }
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function sendOrder() {
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const addr = document.getElementById('cAddr').value;
            if(!name || !phone || !addr) { alert('Please fill all details'); return; }
            const sz = selectedItem.hasSize ? `\nSize: ${document.getElementById('sz').value}` : '';
            window.open(`https://wa.me/2349169688476?text=${encodeURIComponent(`New Order:\nProduct: ${selectedItem.name}${sz}\nPrice: ₦${selectedItem.price}\nName:${name}\nPhone: ${phone}\nAddress:${addr}`)}`, '_blank');
        }

        function filterCat(cat) {
            render(cat === 'all' ? items : items.filter(x => x.cat === cat));
        }

        render(items);
    </script>
</body>
</html>
