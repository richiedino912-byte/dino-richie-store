<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DINO RICHIE STORE - Orders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #111;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ DINO RICHIE STORE</h1>
    <p>Orders Dashboard</p>
  </header>

  <div class="container">

    <a class="back" href="index.html">← Back to Store</a>

    <div class="card">
      <h2>📦 Customer Orders</h2>

      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Amount</th>
            <th>Delivery Location</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td colspan="6" class="empty">
              No orders yet.
            </td>
          </tr>
        </tbody>
      </table>

    </div>

  </div>

</body>
</html>
